server:
  port: 8081
spring:
  application:
    name: "crediYaSolicitudes"
  devtools:
    add-properties: false
  profiles:
    include: null
  webflux:
    base-path: /api/v1
adapters:
  r2dbc:
    host: "localhost"
    port: 3306
    database: "solicitudes"
    username: "app_user"
    password: "juan*201"
  consumer:
    authentication:
      url: http://localhost:8080/api/v1
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
jwt:
  secret: secretsecretsecretsecretsecretsecretsecretsecret
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
  allowed-paths: login,swagger,docs
docs:
  user-handler:
    post-users: http://localhost:8081/webjars/swagger-ui/index.html#/Loan%20Application/sendApplicationLoan
routes:
  paths:
    application: /solicitud